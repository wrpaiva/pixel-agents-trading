version: "3.8"

services:
  web:
    image: ghcr.io/wrpaiva/pixel-agents-trading:1.0.0

    environment:
      NODE_ENV: production
      HOME: /home/node

    networks:
      - waurumai_net

    volumes:
      - pixel_agents_data:/home/node/.pixel-agents

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == waurumai
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=false

volumes:
  pixel_agents_data:

networks:
  waurumai_net:
    external: true
